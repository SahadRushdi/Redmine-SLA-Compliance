  label_sla_clone_source_blank: "— Select a project —"
  button_sla_clone_load: "Load"
  text_sla_clone_confirm_overwrite: "Loading will replace everything currently entered in every section of this policy, not just this one. Continue?"

  button_sla_save_policy: "Save Policy"
  button_sla_save_general: "Save General Settings"
  button_sla_save_measurement: "Save Measurement Rules"
  button_sla_save_exclusions: "Save Exclusions"
  button_sla_save_notifications: "Save Notification Settings"

  # --- Inheritance notice + Revert (B3) ------------------------------------------------------
  text_sla_inherited_notice: "These settings are inherited from %{project} and apply to this project already. Change anything and save, and this project keeps its own copy from then on — %{project}'s later changes will no longer reach it."
  button_sla_view_source_policy: "View source project's policy"
  # The long string names the settings row; the button beside it only has to say what it does.
  button_sla_revert_to_inherited: "Revert to inherited policy"
  button_sla_revert: "Revert"
  text_sla_revert_confirm: "This removes this project's own SLA policy. It will go back to inheriting from %{project}. Continue?"
  text_sla_revert_hint: "Removes this project's own policy so it inherits from %{project} again. Cached SLA results are recalculated, not deleted."
  notice_sla_reverted_to_inherited: "Reverted to the inherited SLA policy."
  text_sla_no_policy_anywhere_hint: "No SLA policy is configured for this project or any parent project yet. Fill in the form below to create one."

  # --- Tri-state SLA on/off for an inheriting subproject -------------------------------------
  label_sla_enablement_card: "SLA for This Project"
  text_sla_enablement_card: "Turn SLA tracking on or off for this project without taking a copy of the inherited settings."
  label_sla_enablement_inherit: "Inherit from %{project}"
  label_sla_enablement_enabled: "Enabled"
  label_sla_enablement_disabled: "Disabled"
  label_sla_enablement_currently_on: "currently on"
  label_sla_enablement_currently_off: "currently off"
  text_sla_enablement_hint: "Enabled and Disabled apply to this project only. Coverage, targets and statuses still follow the inherited policy, so later changes to it keep reaching this project."
  button_sla_save_enablement: "Save SLA Status"
  label_sla_recalculate_historical: "Recalculate historical tickets"
  text_sla_forward_only_hint: "By default, saving applies to new activity only. Tick to re-evaluate all existing tickets against the new policy in the background."
  notice_sla_recalculation_queued: "Historical recalculation has been queued."
  notice_sla_clone_applied: "The full SLA policy was copied from %{project}."
  warning_sla_clone_notifications_skipped: "Notification settings were not copied — you do not have permission to manage notifications on %{project}. Everything else was copied."

  # --- Notification settings (4.6) ----------------------------------------------------------
  label_sla_notifications_section: "Notification Settings"
  # Each card here states its purpose ONCE, in the header. The alert cards' switches sit on that
