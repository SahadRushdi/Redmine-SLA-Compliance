  label_sla_stale_email: "Stale-ticket email digest"
  field_stale_email_enabled: "Enabled"
  field_stale_email_recipients: "Recipients"
  field_stale_email_frequency: "Frequency"
  field_stale_threshold_days: "Stale after (days of inactivity)"
