  # a heading over a separately-labelled field) are gone — they restated the row below them.
  field_sla_tracking: "SLA Tracking"
  text_sla_tracking_hint: "When disabled, no SLA targets will be evaluated for new issues."
  label_sla_coverage_card: "Coverage Hours"
  # Also the coverage select's aria-label, since the row's own title is its visible name.
  field_sla_coverage_schedule: "Coverage schedule"
  text_sla_coverage_schedule_hint: "Specifies the hours during which SLA time is counted. E.g. 24×7×365 for always-on."
  field_sla_enabled: "SLA enabled"
  field_coverage_hours: "Coverage hours"
  label_coverage_24x7: "24×7×365"
  label_coverage_business_hours: "Business Hours"
  field_business_calendar: "Business calendar"
  text_sla_no_business_calendars: "No business calendars defined yet — an administrator can add them under Administration → SLA Compliance."

  label_sla_measurement_rules: "Measurement Rules"
  label_sla_milestones_card: "Status Milestones"
  label_sla_first_response_card: "First Response Rule"
  text_sla_first_response_card: "What counts as the first response to an issue."
  label_sla_at_risk_card: "At-Risk Threshold"
  text_sla_at_risk_card: "Flag a ticket at-risk once this much of its target has elapsed."
  field_sla_created_statuses: "Created statuses"
  field_sla_work_started_statuses: "Work-started statuses"
  field_sla_resolved_statuses: "Resolved statuses"
  text_sla_status_roles_hint: "Statuses that mark each milestone. Leave a field empty to skip that milestone."
  field_first_response_rule: "First response counts as"
  label_first_response_first_comment: "First public comment"
  label_first_response_first_status_change: "First status change"
  label_first_response_either: "Whichever comes first"
  # Also the threshold input's aria-label — the card heading is its visible name now.
  field_at_risk_threshold: "At-risk threshold (%)"

  label_sla_definitions_section: "SLA Targets per Tracker and Priority"
  label_sla_tracker_card: "Tracker Selection"
  text_sla_tracker_card: "Pick every tracker you want to set targets for. Each one gets its own table below, and all of them are saved together."
  label_sla_priority_targets_card: "Priority Targets — %{tracker}"
  # One line above ALL the tracker tables, replacing a per-table caption that restated the heading
