  label_sla_frequency_weekly: "Weekly"
  label_sla_frequency_monthly: "Monthly"
  text_sla_recipients_hint: "Type an address and press Enter to add it."

  # --- Google Chat notification (7.1) -------------------------------------------------------
  # The instance-wide "Default Google Chat webhook" strings that were here are gone with the
