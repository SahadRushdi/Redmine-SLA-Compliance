  # --- SLA Policy tab (Phase 4) ------------------------------------------------------------
  label_sla_policy: "SLA Policy"

  # Sectioned settings shell — page header, sidebar nav entries (label + sub-label).
  label_sla_policy_settings: "SLA Policy Settings"
  # One short line, not a sentence naming every section: the page header sits ABOVE the sidebar and
  # so is on screen for all five sections, where a list of what they contain only repeats the
  # sidebar's own labels and sub-labels back at the reader.
  text_sla_policy_settings_intro: "SLA behaviour for this project."
  label_sla_section_general: "General"
  text_sla_section_general: "SLA status & coverage hours"
  label_sla_section_measurement: "Measurement Rules"
  text_sla_section_measurement: "Statuses, first response & at-risk"
  label_sla_section_targets: "SLA Targets"
  text_sla_section_targets: "Per-tracker priority targets"
  label_sla_section_exclusions: "Exclusions"
  text_sla_section_exclusions: "Pause statuses & handling"
  label_sla_section_notifications: "Notifications"
  text_sla_section_notifications: "Email & webhook alerts"

  # Shown at the top of SLA Targets, Measurement Rules, Exclusions and Notifications while SLA
  # tracking is off — the only thing on those sections that explains why their controls are inert.
  text_sla_section_locked: "SLA tracking is off for this project — turn it on under %{link} to edit these settings."
  label_sla_section_locked_title: "Locked"

  label_sla_policy_general: "General"
  # Each General setting is one row: the *_card / field_* string is its bold name and the *_hint is
