  field_sla_pause_statuses: "Pause statuses"
  field_sla_pause_enabled: "Pause handling enabled"
  text_sla_pause_hint: "Time spent in these statuses is subtracted from SLA measurements. Leave empty for no pauses."

  label_sla_clone_section: "Clone Policy"
  field_sla_clone_source: "Clone from project"
  button_sla_clone_load: "Load"
  text_sla_clone_hint: "Pre-fills this form from another project's policy, including targets for all its trackers. Nothing is saved until you press Save."
  text_sla_clone_confirm_overwrite: "Loading will replace everything currently entered in this form. Continue?"

  text_sla_unsaved_definitions_confirm: "You have unsaved target changes for this tracker. Switching will discard them. Continue?"
  button_sla_save_policy: "Save Policy"
  button_sla_save_notifications: "Save Notification Settings"

  # --- Inheritance banner + Override/Revert (B3) --------------------------------------------
  text_sla_inherited_banner: "This project inherits its SLA policy from %{project}. Editing it here will not change anything until you choose to override it."
  button_sla_override: "Override for this project"
  text_sla_override_confirm: "This loads %{project}'s policy into an editable form here. Nothing is saved until you press Save Policy. Continue?"
  button_sla_view_source_policy: "View source project's policy"
  label_sla_inherited_summary: "Inherited Policy Summary"
  button_sla_revert_to_inherited: "Revert to inherited policy"
  text_sla_revert_confirm: "This removes this project's own SLA policy. It will go back to inheriting from %{project}. Continue?"
  text_sla_revert_hint: "Removes this project's own policy so it inherits from %{project} again. Cached SLA results are recalculated, not deleted."
  notice_sla_reverted_to_inherited: "Reverted to the inherited SLA policy."
  text_sla_no_policy_anywhere_hint: "No SLA policy is configured for this project or any parent project yet. Fill in the form below to create one."
  label_sla_recalculate_historical: "Recalculate historical tickets"
  text_sla_forward_only_hint: "By default, saving applies to new activity only. Tick to re-evaluate all existing tickets against the new policy in the background."
  notice_sla_recalculation_queued: "Historical recalculation has been queued."

