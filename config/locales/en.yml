  field_google_chat_webhook: "Google Chat webhook URL"
  label_sla_at_risk_email: "At-risk email alerts"
  field_at_risk_email_enabled: "Enabled"
  field_at_risk_email_recipients: "Recipients"
  field_at_risk_email_frequency: "Frequency"
  label_sla_frequency_realtime: "Real-time"
  label_sla_frequency_digest: "Digest"
  field_at_risk_digest_interval_minutes: "Digest interval (minutes)"
