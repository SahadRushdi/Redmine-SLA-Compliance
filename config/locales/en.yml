  label_sla_clone_from_project_card: "Clone from existing project"
  text_sla_clone_from_project_card: "Choose a project to copy an existing SLA policy from. Pre-fills every section — General, SLA Targets for all its trackers, Measurement Rules, Exclusions and Notifications. Review them in the sidebar, then press Save Policy to apply the whole set."
