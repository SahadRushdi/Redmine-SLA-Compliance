  # Deliberately the SAME wording as label_sla_tab_open_tickets: the tab, this summary card and the
  # donut all report one metric, and calling it "Total Open Tickets" here made it read as a second,
  # broader figure than the tab it lives on.
  label_sla_card_total: "Tickets"
  # The Open Tickets tab counts only OPEN tickets, so its "met" state means "still inside its
  # target" — it is not the compliance figure. The genuine % SLA met lives on the SLA Trend tab
  # over RESOLVED tickets and uses label_sla_card_met_window below. Keeping the two apart is what
  # stops the same words meaning two different things on one page.
  label_sla_card_met: "SLA Met"
  label_sla_card_met_window: "SLA Met"
  label_sla_card_breached: "SLA Breached"
  label_sla_card_at_risk: "At Risk"
  label_sla_card_no_sla: "No SLA"
  label_sla_card_stale: "Stale"
  label_sla_card_not_configured: "Not Configured"
  label_sla_card_not_tracked: "Not Tracked"
  # Each summary card carries exactly ONE short caption under its number — there are no card
  # tooltips, so a caption that doesn't fit on a line or two of a five-across card is too long to
  # be on the card at all. The unset-Stale caption keeps its pointer to where the threshold is
  # configured, because that card's whole job in that state is to say "go set this".
  label_sla_card_total_caption: "Met + Breached + No SLA"
  label_sla_card_stale_caption: "No activity past threshold"
  label_sla_card_stale_unset_caption: "No threshold set — see Project Settings"
  label_sla_card_at_risk_caption: "Nearing SLA deadline"
  text_sla_card_breached_caption: "%{count} of %{total} open tickets"

