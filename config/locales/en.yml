  # the one thing the headings do not already say: what an all-empty row means.
  text_sla_priority_targets_intro: "A priority with every target unset is excluded from SLA tracking."
  field_sla_trackers: "Trackers"
  text_sla_tracker_selection_hint: "Only the trackers shown here are written when you save. Removing one hides its table and leaves its saved targets untouched — to clear them, set every target to \"not tracked\" instead."
  label_sla_priority: "Priority"
  label_sla_target_response: "Response"
  label_sla_target_workaround: "Workaround"
  label_sla_target_resolution: "Resolution"
  label_sla_target_update_frequency: "Update Frequency"
  label_sla_target_skipped: "— not tracked —"
  label_sla_target_current_value: "Current: %{value}"
  text_sla_definitions_hint: "A priority with every target unset is excluded from SLA tracking. Saving updates the selected trackers only."
  text_sla_no_target_options: "No target duration options defined yet — an administrator can add them under Administration → SLA Compliance."
  text_sla_no_trackers: "This project has no trackers enabled."
  label_sla_unclassified_badge: "Unclassified"
  text_sla_unclassified_row_hint: "Always excluded from SLA evaluation (Administration → SLA Compliance)."
  text_sla_unclassified_notice: "Always excluded from SLA evaluation. Configure global exclusions in %{link}."
  label_sla_admin_settings_link: "Administration → SLA Compliance"

  label_sla_stale_card: "Stale Tickets"
  text_sla_stale_card: "Days of inactivity before an open ticket is flagged stale."
  # Also the input's aria-label — the card heading is its visible name now.
  field_sla_stale_threshold_days_project: "Stale after"
  label_sla_days_suffix: "days of inactivity"
  text_sla_stale_threshold_project_hint: "Leave empty to inherit; a value here also covers subprojects."
  text_sla_stale_threshold_inherited: "Currently inheriting %{days} days from %{source}."
  text_sla_stale_threshold_unset_anywhere: "Not set anywhere — open tickets in this project are never flagged stale."
  label_sla_stale_threshold_placeholder_inherited: "Inherited: %{days}"
  label_sla_stale_threshold_placeholder_unset: "Not set"

  label_sla_pause_section: "Exclusions (Pauses)"
  # The card heading IS the switch's label (the switch sits on the header row), so there is no
  # separate "Pause handling" field label/hint underneath repeating it.
  label_sla_pause_card: "Pause Handling"
  text_sla_pause_card: "Time in these statuses is subtracted from SLA measurements."
  field_sla_pause_statuses: "Pause statuses"
  field_sla_pause_enabled: "Pause handling enabled"
  text_sla_pause_hint: "Time spent in these statuses is subtracted from SLA measurements. Leave empty for no pauses."
  text_sla_pause_statuses_hint: "Leave empty for no pauses."

  # Picking a project and pressing Load are one action, so they are one card with one description
