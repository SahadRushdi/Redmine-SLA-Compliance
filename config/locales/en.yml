  text_sla_at_risk_threshold_hint: "Flag an open ticket as at risk once this percentage of its target time has elapsed."

  label_sla_definitions_section: "SLA Targets per Tracker and Priority"
  field_sla_tracker: "Tracker"
  label_sla_priority: "Priority"
  label_sla_target_response: "Response"
  label_sla_target_workaround: "Workaround"
  label_sla_target_resolution: "Resolution"
  label_sla_target_skipped: "— not tracked —"
  label_sla_target_current_value: "Current: %{value}"
  text_sla_definitions_hint: "Targets apply to the selected tracker. A priority with every target unset is excluded from SLA tracking. Saving updates the selected tracker only."
  text_sla_no_target_options: "No target duration options defined yet — an administrator can add them under Administration → Plugins → SLA Compliance."
  text_sla_no_trackers: "This project has no trackers enabled."
  label_sla_unclassified_badge: "Unclassified"
  text_sla_unclassified_row_hint: "Always excluded from SLA evaluation (Administration → Plugins → SLA Compliance)."

