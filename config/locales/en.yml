  # --- Model attribute names -------------------------------------------------------------------
  # Validation messages are built from the attribute name, so `seconds` would report itself as
  # "Seconds must be greater than 0" — a column the target option form no longer mentions, since
  # the duration is entered as days + hours/minutes. Name it after what is on screen instead.
